<h1>Ask about your data</h1>
<p class="lede">Ask about this dataset or about data science in general. Questions about
your data are answered from the real numbers, and every answer shows its sources.</p>

<div id="chat" class="chat"></div>

<form data-form data-submit="ask" data-sid="{{ sid }}">
  <div class="card askbar">
    <input type="text" name="question" autocomplete="off"
           placeholder="e.g. what is the churn rate by plan">
    <button class="btn primary" type="submit">Ask</button>
  </div>
</form>

<div class="actions">
  <button class="btn" type="button" data-go="report" data-sid="{{ sid }}">Back to the analysis</button>
  <button class="btn" type="button" data-go="restart">Start a new run</button>
</div>
