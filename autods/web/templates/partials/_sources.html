{% if passages %}
<div class="card">
  <h3>Sources</h3>
  <ul class="sources">
    {% for p in passages %}
    <li><span class="src-tag {{ p.kind }}">{{ 'this run' if p.kind == 'run' else 'knowledge' }}</span>
      <div><b>{{ p.title }}</b><span class="src-text">{{ p.text }}</span></div></li>
    {% endfor %}
  </ul>
</div>
{% endif %}
