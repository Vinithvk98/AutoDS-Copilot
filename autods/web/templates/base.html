<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoDS{% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <a href="{{ url_for('index') }}" class="brand"><span class="brand-name">AutoDS</span></a>
      <div class="rail-tag">Data science console</div>

      {% block steps %}{% endblock %}

      <div class="rail-foot">
        <span class="dot"></span> pipeline ready
        <div class="rail-stack">scikit-learn and friends</div>
      </div>
    </aside>

    <main class="main">
      <div class="stagewrap"><div class="container">
        {% block content %}{% endblock %}
      </div></div>
    </main>
  </div>
</body>
</html>
